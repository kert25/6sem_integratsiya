$kind: http-request
name: API-02-06 GET /joke/FooBar
description: "API-02-06. Негативный (интеграционный риск «неверная категория»): несуществующая категория FooBar. Ожидается 4xx, JSON с error=true и описанием допустимых категорий."
url: "{{base_url}}/joke/FooBar"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const resp = pm.response.json();

      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("error is true", function () {
          pm.expect(resp.error).to.eql(true);
      });
      pm.test("Response has property message", function () {
          pm.expect(resp).to.have.property("message");
      });
      pm.test("Error code is 106", function () {
          pm.expect(resp.code).to.eql(106);
      });
    language: text/javascript
order: 1000
