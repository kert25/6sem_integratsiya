$kind: http-request
description: "API-02-10. Негативный (несуществующий ресурс по ID): idRange за пределами существующих id. Ожидается 4xx, error=true (код 106 «No matching joke found»)."
url: "{{base_url}}/joke/Programming?idRange=999999-999999"
method: GET
queryParams:
  idRange: 999999-999999
scripts:
  - type: afterResponse
    code: |-
      const resp = pm.response.json();

      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("error is true", function () {
          pm.expect(resp.error).to.eql(true);
      });
      pm.test("Error code is 106", function () {
          pm.expect(resp.code).to.eql(106);
      });
    language: text/javascript
order: 5000
