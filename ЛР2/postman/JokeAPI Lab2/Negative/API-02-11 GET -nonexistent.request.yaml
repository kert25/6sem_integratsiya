$kind: http-request
name: API-02-11 GET /nonexistent
description: "API-02-11. Негативный: несуществующий эндпоинт. Ожидается 404 с JSON-телом ошибки. Фактически (замечание): 404, но тело — HTML-страница, а не JSON (риск для клиентов, ожидающих JSON)."
url: "{{base_url}}/nonexistent"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error body is JSON (expected for REST API)", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("json");
      });
    language: text/javascript
order: 6000
