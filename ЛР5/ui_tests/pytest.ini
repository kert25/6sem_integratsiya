[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Отчеты
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/ui_report.html
    --self-contained-html
    --junitxml=reports/junit_ui.xml
    --reruns=1
    --reruns-delay=2

# Параметры запуска (определяются в tests/conftest.py):
#   --browser=chrome|firefox|edge  --headless
# Отчет Allure: py -m pytest --alluredir=reports/allure_ui

markers =
    smoke: быстрые smoke-тесты
    slow: медленные тесты
    negative: негативные тесты
    inputs: тесты раздела Inputs
    notifications: тесты раздела Notification Messages
    geolocation: тесты раздела Geolocation
