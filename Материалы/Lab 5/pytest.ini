[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Отчеты
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/ui_report.html
    --self-contained-html
    --junitxml=reports/junit_ui.xml
    --reruns=1
    --reruns-delay=2

# Параметры
markers =
    smoke: быстрые smoke-тесты
    slow: медленные тесты
    integration: интеграционные тесты
    negative: негативные тесты
    login: тесты авторизации
    tasks: тесты задач
    products: тесты товаров

# Настройки для параллельного запуска
# addopts = -n auto  # раскомментировать для параллельного запуска

# Фильтрация тестов по маркерам
# addopts = -m smoke  # только smoke-тесты
