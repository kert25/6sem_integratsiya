version: '3.8'

services:
  # Базы данных
  postgres-users:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - ./init/users.sql:/docker-entrypoint-initdb.d/init.sql

  postgres-products:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    volumes:
      - ./init/products.sql:/docker-entrypoint-initdb.d/init.sql

  postgres-orders:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5435:5432"
    volumes:
      - ./init/orders.sql:/docker-entrypoint-initdb.d/init.sql

  # Сервис пользователей
  user-service:
    build: ./services/user-service
    ports:
      - "8001:8001"
    environment:
      DB_HOST: postgres-users
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: admin
      DB_PASSWORD: password123
      JWT_SECRET: test-secret-key-123
    depends_on:
      - postgres-users

  # Сервис товаров
  product-service:
    build: ./services/product-service
    ports:
      - "8002:8002"
    environment:
      DB_HOST: postgres-products
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: admin
      DB_PASSWORD: password123
    depends_on:
      - postgres-products

  # Сервис заказов
  order-service:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      DB_HOST: postgres-orders
      DB_PORT: 5432
      DB_NAME: orders_db
      DB_USER: admin
      DB_PASSWORD: password123
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
      PAYMENT_SERVICE_URL: http://payment-mock:8004
    depends_on:
      - postgres-orders
      - user-service
      - product-service
      - payment-mock

  # Mock платежной системы
  payment-mock:
    build: ./services/payment-mock
    ports:
      - "8004:8004"

  # API Gateway
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - product-service
      - order-service
